<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0f0f">
<title>Ansulais | Catálogo</title>
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- App instalable (ver app.webmanifest y sw.js) -->
<link rel="manifest" href="app.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ansulais">
<meta name="robots" content="noindex, nofollow">
<style>
  /* Misma letra y paleta que ansulais.com. La letra va en la carpeta para que se vea
     bien aunque la tablet se quede sin internet. */
  @font-face {
    font-family: 'Montserrat';
    src: url('tipografia/Montserrat-latin.woff2') format('woff2');
    font-weight: 400 800;
    font-display: swap;
  }

  :root {
    --beige-light: #fdf8ec;
    --maroon: #1a1a1a; --maroon-deep: #0f0f0f;
    --wood: #8a5a35;
    --line: rgba(253, 248, 236, 0.16);
    --muted: rgba(253, 248, 236, 0.62);
    --header-h: 64px;
    --controls-h: 64px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--maroon-deep);
    color: var(--beige-light);
    font-family: 'Montserrat', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  button { font-family: inherit; border: none; background: none; color: inherit; cursor: pointer; }
  img { -webkit-user-drag: none; -webkit-touch-callout: none; user-select: none; }

  /* ---------- ENCABEZADO ---------- */
  #header {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--header-h);
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    background: var(--maroon-deep);
    border-bottom: 1px solid rgba(253, 248, 236, 0.08);
    z-index: 100;
  }

  .header-logo { flex-shrink: 0; height: 30px; width: auto; color: var(--beige-light); }

  #tabs {
    flex: 1;
    display: flex;
    justify-content: center;
    gap: 8px;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  #tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex-shrink: 0;
    padding: 9px 18px;
    border-radius: 100px;
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    white-space: nowrap;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .tab:hover { color: var(--beige-light); border-color: rgba(253, 248, 236, 0.4); }
  .tab.active { background: var(--beige-light); color: var(--maroon-deep); border-color: transparent; }
  .tab .chev { display: inline-block; margin-left: 4px; font-size: 0.75em; transition: transform 0.2s ease; }
  .tab.open .chev { transform: rotate(180deg); }

  .header-actions { flex-shrink: 0; display: flex; gap: 8px; }

  .icon-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--beige-light);
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .icon-btn:hover { background: rgba(253, 248, 236, 0.08); border-color: rgba(253, 248, 236, 0.4); }
  .icon-btn svg { width: 18px; height: 18px; }

  /* El menú de Auxiliares es fixed (no absolute) porque #tabs tiene overflow-x y lo recortaría */
  #aux-menu {
    position: fixed;
    display: none;
    flex-direction: column;
    gap: 4px;
    min-width: 210px;
    padding: 8px;
    background: var(--maroon);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 20px 50px -16px rgba(0, 0, 0, 0.6);
    z-index: 200;
  }
  #aux-menu.open { display: flex; }
  .aux-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    text-align: left;
  }
  .aux-item:hover { background: rgba(253, 248, 236, 0.07); }
  .aux-item.active { background: var(--beige-light); color: var(--maroon-deep); font-weight: 700; }
  .aux-item small { font-size: 11px; font-weight: 600; opacity: 0.55; }

  /* ---------- LIBRO ---------- */
  #book {
    position: fixed;
    top: var(--header-h);
    bottom: var(--controls-h);
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: pan-y pinch-zoom;
  }

  #viewport {
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    box-shadow: 0 30px 70px -30px rgba(0, 0, 0, 0.8);
    transition: opacity 0.25s ease;
  }
  #viewport.is-switching { opacity: 0; }

  #track { display: flex; height: 100%; will-change: transform; }

  .slide {
    position: relative;
    flex: none;
    height: 100%;
    overflow: hidden;
    background: var(--beige-light);
  }

  /* Todas las páginas se diseñan a 1600 × 900 y se escalan con transform, así se ven
     igual en cualquier pantalla. Todas comparten el mismo marco: margen beige, foto
     redondeada y el logo arriba a la izquierda (en las páginas de los PDF el logo ya
     viene en la foto, en el mismo lugar). */
  .design {
    position: absolute;
    top: 0; left: 0;
    width: 1600px;
    height: 900px;
    transform-origin: 0 0;
  }

  .frame {
    position: absolute;
    inset: 36px;
    border-radius: 28px;
    overflow: hidden;
    background: #e6dfd3;
  }
  .frame > img.full { width: 100%; height: 100%; object-fit: cover; display: block; }

  .frame-logo { position: absolute; top: 40px; left: 60px; width: 52px; height: auto; color: var(--maroon); z-index: 2; }

  /* Pieza agregada desde la web: igual que las páginas de los PDF, solo el mueble llenando
     el marco. Con varias fotos van dos vistas lado a lado; con una sola, centrada sobre un
     degradado de los colores del borde de la foto (bg en piezas.js) para que se funda. */
  .piece-pair { position: absolute; inset: 0; display: flex; }
  .piece-pair img { flex: 1; min-width: 0; height: 100%; object-fit: cover; display: block; }
  .piece-single {
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    height: 100%;
    aspect-ratio: 1 / 1;
    transform: translateX(-50%) scale(1.15); /* la foto trae mucho margen: se acerca un poco */
    object-fit: cover;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 14%, #000 86%, transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 14%, #000 86%, transparent 100%);
  }

  /* Portada y contraportada: mismo marco, con panel oscuro como el de la web */
  .frame.dark { background: var(--maroon-deep); color: var(--beige-light); }
  .cover-photo { position: absolute; top: 0; bottom: 0; left: 0; width: 46%; }
  .cover-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-text { position: absolute; top: 0; bottom: 0; left: 46%; right: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 100px; }
  .cover-wordmark { width: 300px; height: auto; color: var(--beige-light); margin-bottom: 56px; }
  .cover-title { font-size: 92px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.02; }
  .cover-soon { margin-top: 28px; font-size: 22px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

  .back-inner { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 120px; }
  .back-wordmark { width: 420px; height: auto; color: var(--beige-light); }
  .back-qr { width: 300px; padding: 30px; border-radius: 26px; background: var(--beige-light); color: var(--maroon); text-align: center; }
  .back-qr img { width: 100%; height: auto; display: block; margin-bottom: 18px; }
  .back-qr p { font-size: 19px; font-weight: 700; }

  /* ---------- CONTROLES ---------- */
  #controls {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--controls-h);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    background: var(--maroon-deep);
    border-top: 1px solid rgba(253, 248, 236, 0.08);
    z-index: 100;
  }
  #indicator { min-width: 140px; text-align: center; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  #indicator b { color: var(--beige-light); font-weight: 700; }
  #progress { position: absolute; top: -1px; left: 0; height: 2px; background: var(--wood); transition: width 0.35s ease; }

  /* ---------- ÍNDICE ---------- */
  #index {
    position: fixed;
    inset: 0;
    z-index: 250;
    display: flex;
    flex-direction: column;
    background: var(--maroon-deep);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  #index.open { opacity: 1; pointer-events: auto; }
  .index-head {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 16px 24px;
    border-bottom: 1px solid rgba(253, 248, 236, 0.08);
  }
  .index-head h2 { font-size: 20px; font-weight: 700; }
  .index-head span { font-size: 14px; color: var(--muted); font-weight: 500; margin-left: 10px; }
  #index-grid {
    flex: 1;
    overflow-y: auto;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    align-content: start;
    gap: 18px;
    padding: 24px;
  }
  .index-item { text-align: left; }
  .index-thumb {
    position: relative;
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    overflow: hidden;
    background: var(--maroon);
    border: 2px solid transparent;
    transition: border-color 0.2s ease;
  }
  .index-item.current .index-thumb { border-color: var(--beige-light); }
  .index-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .index-thumb.is-piece { background: #e6dfd3; }
  .index-thumb.is-piece img { width: 56.25%; margin: 0 auto; }
  .index-thumb.is-dark { display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; color: var(--muted); }
  .index-label { display: block; margin-top: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .index-label b { color: var(--beige-light); }

  /* ---------- PANTALLA DE CARGA (igual a la de la web) ---------- */
  #loading {
    position: fixed;
    inset: 0;
    z-index: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    background: var(--maroon-deep);
    transition: opacity 0.4s ease, visibility 0.4s ease;
  }
  #loading.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  #loading svg { width: 56px; height: auto; color: var(--beige-light); animation: pulse 1.4s ease-in-out infinite; }
  .dots { display: flex; gap: 8px; }
  .dots span { width: 8px; height: 8px; border-radius: 50%; background: var(--beige-light); opacity: 0.4; animation: dot 1.1s ease-in-out infinite; }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes pulse { 0%, 100% { opacity: 0.55; transform: scale(0.94); } 50% { opacity: 1; transform: scale(1); } }
  @keyframes dot { 0%, 80%, 100% { opacity: 0.3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }

  /* Instalada como app ya abre a pantalla completa */
  @media (display-mode: fullscreen), (display-mode: standalone) {
    #btn-fs { display: none; }
  }
  .icon-btn[hidden] { display: none; }

  /* ---------- PANTALLAS PEQUEÑAS ---------- */
  @media (max-width: 760px) {
    :root { --header-h: 58px; --controls-h: 58px; }
    #header { padding: 0 12px; gap: 10px; }
    .header-logo { height: 24px; }
    #tabs { justify-content: flex-start; }
    .tab { padding: 7px 13px; font-size: 13px; }
    #btn-fs { display: none; }
    #index-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; padding: 16px; }
  }
</style>
</head>
<body>

<header id="header">
  <svg class="header-logo" viewBox="0 0 340.36 440.13" aria-hidden="true"><use href="#logo-a"/></svg>
  <nav id="tabs">
    <button class="tab" data-section="salas">Salas</button>
    <button class="tab" data-section="comedores">Comedores</button>
    <button class="tab" data-section="alcobas">Alcobas</button>
    <button class="tab" id="tab-aux" type="button" aria-haspopup="true" aria-expanded="false">Auxiliares <span class="chev">&#9662;</span></button>
  </nav>
  <div class="header-actions">
    <button class="icon-btn" id="btn-index" aria-label="Ver todas las páginas">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </button>
    <button class="icon-btn" id="btn-install" aria-label="Instalar como app" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    </button>
    <button class="icon-btn" id="btn-fs" aria-label="Pantalla completa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</header>

<div id="aux-menu" role="menu">
  <button class="aux-item" data-section="aux-salas">Salas <small>TV y mesas de centro</small></button>
  <button class="aux-item" data-section="aux-comedores">Comedores <small>próximamente</small></button>
  <button class="aux-item" data-section="aux-alcobas">Alcobas <small>mesas de noche</small></button>
</div>

<main id="book">
  <div id="viewport"><div id="track"></div></div>
</main>

<footer id="controls">

  <button class="icon-btn" id="btn-prev" aria-label="Página anterior">

  <div id="indicator">Portada</div>

</footer>

  </div>

</div>

<script src="piezas.js"></script>
<script>
  // ---------- Secciones ----------
  // pages: cuántas páginas sacadas de los PDF hay en pages/<dir>/ (p01.webp, p02.webp…).
  // Las piezas de la web que no están en los PDF vienen de piezas.js (preparar_catalogo.py)
  // y se agregan al final de su sección como fichas.
  var SECCIONES = {
    'salas':         { tab: 'salas', title: 'Salas & sofás', dir: 'salas', pages: 38 },
    'comedores':     { tab: 'comedores', title: 'Comedores', dir: 'comedores', pages: 24 },
    'alcobas':       { tab: 'alcobas', title: 'Alcobas', dir: 'alcobas', pages: 33 },
    'aux-salas':     { tab: 'aux', title: 'Muebles de TV y mesas de centro', dir: 'aux-salas', pages: 32 },
    'aux-comedores': { tab: 'aux', title: 'Bifés y aparadores', pronto: true },
    'aux-alcobas':   { tab: 'aux', title: 'Mesas de noche', dir: null, pages: 0 }
  };
  var NUEVAS = window.PIEZAS_NUEVAS || {};
  var DESIGN_W = 1600, DESIGN_H = 900;

  var track = document.getElementById('track');
  var viewport = document.getElementById('viewport');
  var indicator = document.getElementById('indicator');
  var progress = document.getElementById('progress');
  var state = { id: null, slides: [], index: 0, W: 0, H: 0 };

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function svgUse(id, cls) { return '<svg class="' + cls + '" viewBox="' + (id === 'wordmark' ? '0 0 552 89' : '0 0 340.36 440.13') + '" aria-hidden="true"><use href="#' + id + '"/></svg>'; }

  // ---------- Contenido de cada tipo de página ----------
  // El catálogo lo maneja el asesor, no el cliente: las páginas muestran solo el mueble
  // (nombre, código y detalles los da el asesor; el código sale en el índice).
  function coverHtml(id, sec) {
    var photo = sec.pronto ? 'portadas/comedores.webp' : 'portadas/' + id + '.webp';
    return '<div class="design"><div class="frame dark">' +
      '<div class="cover-photo"><img src="' + photo + '" alt=""></div>' +
      '<div class="cover-text">' + svgUse('wordmark', 'cover-wordmark') +
        '<h1 class="cover-title">' + esc(sec.title) + '</h1>' +
        (sec.pronto ? '<span class="cover-soon">Próximamente</span>' : '') +
      '</div></div></div>';
  }

  function pageHtml(s) {
    return '<div class="design"><div class="frame"><img class="full" data-src="' + s.src + '" alt=""></div></div>';
  }

  function pieceBg(p) {
    return 'linear-gradient(to bottom, ' + (p.bg || ['#e6dfd3']).join(', ') + ')';
  }

  function pieceHtml(p) {
    var ph = p.photos;
    var inner = ph.length > 1
      ? '<div class="piece-pair"><img data-src="' + ph[0] + '.webp" alt="' + esc(p.name) + '"><img data-src="' + ph[ph.length - 1] + '.webp" alt=""></div>'
      : '<img class="piece-single" data-src="' + ph[0] + '.webp" alt="' + esc(p.name) + '">';
    return '<div class="design"><div class="frame" style="background:' + pieceBg(p) + '">' +
      inner + svgUse('logo-a', 'frame-logo') + '</div></div>';
  }

  // Contraportada: solo el logo y un QR por si el cliente quiere ver el catálogo en su celular
  function backHtml(id, sec) {
    return '<div class="design"><div class="frame dark"><div class="back-inner">' +
      svgUse('wordmark', 'back-wordmark') +
      '<div class="back-qr"><img src="qr/' + id + '.svg" alt="Código QR">' +
        '<p>' + (sec.pronto ? 'Escríbenos por WhatsApp' : 'ansulais.com') + '</p></div>' +
      '</div></div></div>';
  }

  // Lista de páginas de una sección: portada, páginas de los PDF, fichas nuevas, contraportada
  function buildSlides(id) {
    var sec = SECCIONES[id];
    var list = [{ kind: 'cover', html: coverHtml(id, sec), label: 'Portada' }];
    for (var i = 1; i <= (sec.pages || 0); i++) {
      var n = (i < 10 ? '0' : '') + i;
      list.push({ kind: 'page', src: 'pages/' + sec.dir + '/p' + n + '.webp', thumb: 'pages/' + sec.dir + '/thumbs/p' + n + '.webp', label: 'Página ' + i });
    }
    (NUEVAS[id] || []).forEach(function (p) {
      list.push({ kind: 'piece', piece: p, html: pieceHtml(p), thumb: p.photos[0] + '-sm.webp', label: p.name });
    });
    list.push({ kind: 'back', html: backHtml(id, sec), label: 'Contraportada' });
    return list;
  }

  // ---------- Tamaño ----------
  function fit() {
    var book = document.getElementById('book');
    var pad = window.innerWidth < 760 ? 10 : 24;
    var avW = book.clientWidth - pad * 2;
    var avH = book.clientHeight - pad * 2;
    var W = avW, H = Math.round(W * DESIGN_H / DESIGN_W);
    if (H > avH) { H = avH; W = Math.round(H * DESIGN_W / DESIGN_H); }
    state.W = W; state.H = H;
    viewport.style.width = W + 'px';
    viewport.style.height = H + 'px';
    var scale = W / DESIGN_W;
    track.querySelectorAll('.slide').forEach(function (s) { s.style.width = W + 'px'; });
    track.querySelectorAll('.design').forEach(function (d) { d.style.transform = 'scale(' + scale + ')'; });
    setPosition(state.index, false);
  }

  // Solo se cargan las fotos de la página actual y sus vecinas, para que la tablet no
  // descargue 40 páginas de golpe al cambiar de sección.
  function ensureLoaded(center) {
    for (var i = center - 1; i <= center + 2; i++) {
      var slide = track.children[i];
      if (!slide || slide.dataset.loaded) continue;
      slide.querySelectorAll('img[data-src]').forEach(function (img) { img.src = img.dataset.src; img.removeAttribute('data-src'); });
      slide.dataset.loaded = '1';
    }
  }

  function setPosition(i, animate) {
    state.index = Math.max(0, Math.min(i, state.slides.length - 1));
    track.style.transition = animate ? 'transform 0.42s cubic-bezier(.22,.61,.36,1)' : 'none';
    track.style.transform = 'translateX(' + (-state.index * state.W) + 'px)';
    ensureLoaded(state.index);
    updateIndicator();
  }

  function updateIndicator() {
    var total = state.slides.length;
    var s = state.slides[state.index];
    if (!s) return;
    if (s.kind === 'cover') indicator.innerHTML = '<b>Portada</b>';
    else if (s.kind === 'back') indicator.innerHTML = '<b>Contraportada</b>';
    else indicator.innerHTML = '<b>' + state.index + '</b> / ' + (total - 2);
    progress.style.width = (total > 1 ? (state.index / (total - 1)) * 100 : 0) + '%';
  }

  function goNext() { setPosition(state.index + 1, true); }
  function goPrev() { setPosition(state.index - 1, true); }

  // ---------- Cambiar de sección ----------
  function loadSection(id) {
    if (!SECCIONES[id] || id === state.id) return;
    state.id = id;
    document.querySelectorAll('.tab[data-section]').forEach(function (t) { t.classList.toggle('active', t.dataset.section === id); });
    document.getElementById('tab-aux').classList.toggle('active', SECCIONES[id].tab === 'aux');
    document.querySelectorAll('.aux-item').forEach(function (t) { t.classList.toggle('active', t.dataset.section === id); });
    try { localStorage.setItem('ansulais_tablet_seccion', id); } catch (e) {}

    viewport.classList.add('is-switching');
    setTimeout(function () {
      state.slides = buildSlides(id);
      track.innerHTML = state.slides.map(function (s) {
        var inner = s.kind === 'page' ? pageHtml(s) : s.html;
        return '<div class="slide slide-' + s.kind + '">' + inner + '</div>';
      }).join('');
      state.index = 0;
      fit();
      viewport.classList.remove('is-switching');
    }, 180);
  }

  // ---------- Deslizar con el dedo o arrastrar con el mouse ----------
  // Sigue el dedo y pasa de página si se arrastra más del 18 % del ancho. Con dos dedos
  // se cancela y el navegador hace el zoom normal (touch-action: pinch-zoom).
  (function () {
    var el = document.getElementById('book');
    var active = new Map();
    var dragging = false, moved = false, startX = 0, startTx = 0;

    el.addEventListener('pointerdown', function (e) {
      active.set(e.pointerId, true);
      if (active.size > 1) { if (dragging) setPosition(state.index, true); dragging = false; return; }
      dragging = true; moved = false;
      startX = e.clientX; startTx = -state.index * state.W;
      track.style.transition = 'none';
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
    });

    el.addEventListener('pointermove', function (e) {
      if (!dragging || active.size > 1) return;
      var dx = e.clientX - startX;
      if (Math.abs(dx) > 6) moved = true;
      if (!moved) return;
      var min = -(state.slides.length - 1) * state.W;
      var next = startTx + dx;
      if (next > 0) next *= 0.35;
      if (next < min) next = min + (next - min) * 0.35;
      track.style.transform = 'translateX(' + next + 'px)';
    });

    function finish(e, commit) {
      active.delete(e.pointerId);
      if (!dragging) return;
      dragging = false;
      if (!commit) { setPosition(state.index, true); return; }
      if (!moved) return;
      var dx = e.clientX - startX;
      var threshold = state.W * 0.18;
      if (dx <= -threshold) goNext();
      else if (dx >= threshold) goPrev();
      else setPosition(state.index, true);
    }

    el.addEventListener('pointerup', function (e) { finish(e, true); });
    el.addEventListener('pointercancel', function (e) { finish(e, false); });
  })();

  // ---------- Índice ----------
  var indexEl = document.getElementById('index');
  function openIndex() {
    var sec = SECCIONES[state.id];
    document.getElementById('index-title').innerHTML = esc(sec.title) + '<span>' + (state.slides.length - 2) + ' páginas</span>';
    document.getElementById('index-grid').innerHTML = state.slides.map(function (s, i) {
      var thumb;
      if (s.kind === 'page') thumb = '<div class="index-thumb"><img src="' + s.thumb + '" alt="" loading="lazy"></div>';
      else if (s.kind === 'piece') thumb = '<div class="index-thumb is-piece"><img src="' + s.thumb + '" alt="" loading="lazy"></div>';
      else thumb = '<div class="index-thumb is-dark">' + s.label + '</div>';
      var label = s.kind === 'piece' ? '<b>' + esc(s.piece.code) + '</b> ' + esc(s.label) : (s.kind === 'page' ? '<b>' + i + '</b>' : '');
      return '<button class="index-item' + (i === state.index ? ' current' : '') + '" data-i="' + i + '">' + thumb + (label ? '<span class="index-label">' + label + '</span>' : '') + '</button>';
    }).join('');
    indexEl.classList.add('open');
    indexEl.setAttribute('aria-hidden', 'false');
    var current = indexEl.querySelector('.current');
    if (current) current.scrollIntoView({ block: 'center' });
  }
  function closeIndex() { indexEl.classList.remove('open'); indexEl.setAttribute('aria-hidden', 'true'); }
  document.getElementById('btn-index').addEventListener('click', openIndex);
  document.getElementById('btn-index-close').addEventListener('click', closeIndex);
  document.getElementById('index-grid').addEventListener('click', function (e) {
    var item = e.target.closest('.index-item');
    if (!item) return;
    setPosition(+item.dataset.i, false);
    closeIndex();
  });

  // ---------- Menú de Auxiliares ----------
  var auxTab = document.getElementById('tab-aux');
  var auxMenu = document.getElementById('aux-menu');
  function toggleAux(open) {
    var willOpen = open !== undefined ? open : !auxMenu.classList.contains('open');
    auxMenu.classList.toggle('open', willOpen);
    auxTab.classList.toggle('open', willOpen);
    auxTab.setAttribute('aria-expanded', willOpen);
    if (!willOpen) return;
    var r = auxTab.getBoundingClientRect();
    auxMenu.style.top = (r.bottom + 8) + 'px';
    var left = r.left + r.width / 2 - auxMenu.offsetWidth / 2;
    auxMenu.style.left = Math.max(8, Math.min(left, window.innerWidth - auxMenu.offsetWidth - 8)) + 'px';
  }
  auxTab.addEventListener('click', function (e) { e.stopPropagation(); toggleAux(); });
  document.querySelectorAll('.aux-item').forEach(function (item) {
    item.addEventListener('click', function (e) { e.stopPropagation(); toggleAux(false); loadSection(item.dataset.section); });
  });
  document.addEventListener('click', function () { toggleAux(false); });
  document.querySelectorAll('.tab[data-section]').forEach(function (t) {
    t.addEventListener('click', function () { loadSection(t.dataset.section); });
  });

  // ---------- Botones, teclado y pantalla completa ----------
  document.getElementById('btn-next').addEventListener('click', goNext);
  document.getElementById('btn-prev').addEventListener('click', goPrev);
  document.addEventListener('keydown', function (e) {
    if (indexEl.classList.contains('open')) { if (e.key === 'Escape') closeIndex(); return; }
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') goNext();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goPrev();
  });
  document.addEventListener('contextmenu', function (e) { if (e.target.tagName === 'IMG') e.preventDefault(); });

  document.getElementById('btn-fs').addEventListener('click', function () {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(function () {});
    else document.exitFullscreen();
  });

  // Que la tablet no apague la pantalla mientras se muestra el catálogo a pantalla completa
  // o instalado como app (si el navegador lo permite). El navegador suelta el bloqueo al
  // salir de la app, por eso se vuelve a pedir al regresar.
  var wakeLock = null;
  function isAppMode() {
    return !!document.fullscreenElement || window.matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches || navigator.standalone === true;
  }
  function updateWakeLock() {
    if (!navigator.wakeLock) return;
    if (isAppMode() && document.visibilityState === 'visible') {
      if (!wakeLock) navigator.wakeLock.request('screen').then(function (l) { wakeLock = l; l.addEventListener('release', function () { wakeLock = null; }); }).catch(function () {});
    } else if (wakeLock) { wakeLock.release(); wakeLock = null; }
  }
  document.addEventListener('fullscreenchange', updateWakeLock);
  document.addEventListener('visibilitychange', updateWakeLock);
  updateWakeLock();

  // ---------- Instalar como app ----------
  // Chrome/Edge en Android avisan cuando se puede instalar: ahí aparece el botón de
  // descarga. En iPad se instala desde Safari: Compartir > Agregar a inicio.
  var installPrompt = null;
  var btnInstall = document.getElementById('btn-install');
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    installPrompt = e;
    btnInstall.hidden = false;
  });
  btnInstall.addEventListener('click', function () {
    if (!installPrompt) return;
    installPrompt.prompt();
    installPrompt.userChoice.finally(function () { installPrompt = null; btnInstall.hidden = true; });
  });
  window.addEventListener('appinstalled', function () { btnInstall.hidden = true; });

  // Guardar el catálogo en la tablet para usarlo sin internet (requiere https; abierto
  // como archivo suelto en el computador no aplica)
  if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js');
  }

  var resizeTimer;
  window.addEventListener('resize', function () {
    toggleAux(false);
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(fit, 150);
  });

  // ---------- Inicio ----------
  var first = 'salas';
  try { var saved = localStorage.getItem('ansulais_tablet_seccion'); if (SECCIONES[saved]) first = saved; } catch (e) {}
  loadSection(first);
  window.addEventListener('load', function () { setTimeout(function () { document.getElementById('loading').classList.add('hidden'); }, 400); });
  setTimeout(function () { document.getElementById('loading').classList.add('hidden'); }, 4000);
</script>
</body>
</html>
